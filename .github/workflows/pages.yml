# The only InaZurvivors workflow. A push checks the code and compiles it without resources; nothing is deployed.
# Deploying is a manual run with "publicar" on: it integrates the private resources, compiles and checks dist/.
# The prueba-recursos job checks the private repository; it has no Pages permission and uploads nothing.
# The sitio job deploys only the informative pages (text, no game resources) until the game is published.
name: Deploy InaZurvivors (web)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publicar:
        description: Integrar los recursos y desplegar
        type: boolean
        default: false
      probar_recursos:
        description: Probar el acceso a los recursos, sin desplegar
        type: boolean
        default: false
      sitio_informativo:
        description: Desplegar solo las páginas informativas
        type: boolean
        default: false
      pruebas:
        description: Con «publicar», subir también la versión de pruebas (rama pre2-coop) en /pruebas/
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  PUBLICAR: ${{ github.event_name == 'workflow_dispatch' && inputs.publicar }}
  PRUEBAS: ${{ github.event_name == 'workflow_dispatch' && inputs.publicar && inputs.pruebas }}

jobs:
  sitio:
    if: (github.event_name == 'push' && contains(github.event.head_commit.message, '[sitio-informativo]')) || (github.event_name == 'workflow_dispatch' && inputs.sitio_informativo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reunir las páginas
        run: |
          mkdir _sitio
          cp sitio/index.html public/privacidad.html public/terminos.html _sitio/
          if [ "$(ls _sitio | wc -l)" != 3 ] || grep -lE '<(img|audio|video)|url\(' _sitio/*; then echo "ERROR: el sitio informativo solo lleva texto"; exit 1; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _sitio
  desplegar-sitio:
    needs: sitio
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  prueba-recursos:
    if: (github.event_name == 'push' && contains(github.event.head_commit.message, '[prueba-recursos]')) || (github.event_name == 'workflow_dispatch' && inputs.probar_recursos)
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://svtkmuxwdxdwvdvjchut.supabase.co' }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || 'sb_publishable_CNdrHsKes1JJV4TEsUbzXg_t7_0fnnW' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: El secreto existe
        env:
          RECURSOS_TOKEN: ${{ secrets.RECURSOS_TOKEN }}
        run: |
          if [ -z "$RECURSOS_TOKEN" ]; then echo "ERROR: falta el secreto RECURSOS_TOKEN"; exit 1; fi
      - name: Descargar el commit de recursos
        uses: actions/checkout@v4
        with:
          repository: AstraStorm/-InaZurvivors-recursos
          ref: 30946bda8e74ac6388d97372686b9bbfff8d422a
          token: ${{ secrets.RECURSOS_TOKEN }}
          path: .recursos
          persist-credentials: false
      - name: El token no puede escribir
        env:
          RECURSOS_TOKEN: ${{ secrets.RECURSOS_TOKEN }}
        run: |
          B64=$(printf 'x-access-token:%s' "$RECURSOS_TOKEN" | base64 -w0)
          echo "::add-mask::$B64"
          if git -C .recursos -c http.extraheader="AUTHORIZATION: basic $B64" push --dry-run https://github.com/AstraStorm/-InaZurvivors-recursos.git HEAD:refs/heads/prueba-solo-lectura >/dev/null 2>&1; then
            echo "ERROR: el token tiene permiso de escritura"; exit 1
          fi
      - name: Verificar todos los archivos
        run: node tools/integrar_recursos.mjs --recursos .recursos --verificar
      - name: Integrar para la prueba
        run: node tools/integrar_recursos.mjs --recursos .recursos
      - run: npx vite build
      - name: Comprobar la build y las credenciales
        env:
          RECURSOS_TOKEN: ${{ secrets.RECURSOS_TOKEN }}
        run: node tools/comprobar_build.mjs --recursos .recursos
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx vitest run tests/systems.test.ts tests/online.test.ts
      - run: npx tsc --noEmit
      - name: Comprobar el acceso a los recursos
        if: env.PUBLICAR == 'true'
        env:
          RECURSOS_TOKEN: ${{ secrets.RECURSOS_TOKEN }}
        run: |
          if [ -z "$RECURSOS_TOKEN" ]; then echo "ERROR: falta el secreto RECURSOS_TOKEN"; exit 1; fi
      - name: Descargar los recursos
        if: env.PUBLICAR == 'true'
        uses: actions/checkout@v4
        with:
          repository: AstraStorm/-InaZurvivors-recursos
          token: ${{ secrets.RECURSOS_TOKEN }}
          path: .recursos
          persist-credentials: false
      - name: Integrar los recursos
        if: env.PUBLICAR == 'true'
        run: node tools/integrar_recursos.mjs --recursos .recursos
      - run: npx vite build
        env:
          # public values: the publishable key is meant for the browser; no secret ever goes here
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://svtkmuxwdxdwvdvjchut.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || 'sb_publishable_CNdrHsKes1JJV4TEsUbzXg_t7_0fnnW' }}
      - name: Comprobar la build
        if: env.PUBLICAR == 'true'
        env:
          RECURSOS_TOKEN: ${{ secrets.RECURSOS_TOKEN }}
        run: node tools/comprobar_build.mjs --recursos .recursos
      # pre-2.0: the test build (branch pre2-coop), checked the same way, goes in dist/pruebas/ next to the real game
      - name: Descargar la versión de pruebas
        if: env.PRUEBAS == 'true'
        uses: actions/checkout@v4
        with:
          ref: pre2-coop
          path: _pruebas
          persist-credentials: false
      - name: Compilar y comprobar la versión de pruebas
        if: env.PRUEBAS == 'true'
        working-directory: _pruebas
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://svtkmuxwdxdwvdvjchut.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || 'sb_publishable_CNdrHsKes1JJV4TEsUbzXg_t7_0fnnW' }}
          RECURSOS_TOKEN: ${{ secrets.RECURSOS_TOKEN }}
        run: |
          npm ci
          npx vitest run tests/systems.test.ts tests/online.test.ts
          npx tsc --noEmit
          node tools/integrar_recursos.mjs --recursos ../.recursos
          npx vite build --base /InaZurvivors/pruebas/
          node ../tools/comprobar_build.mjs --recursos ../.recursos --base /InaZurvivors/pruebas/
          mkdir -p ../dist/pruebas
          cp -r dist/. ../dist/pruebas/
      - if: env.PUBLICAR == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.publicar
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
