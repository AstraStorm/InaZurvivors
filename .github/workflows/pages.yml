# The only InaZurvivors workflow. A push checks the code and compiles it without resources; nothing is deployed.
# Deploying is a manual run with "publicar" on: it integrates only the groups authorised in config/autorizacion_recursos.json
# and stops with an explicit error if a required group is missing (PUBLICACION.md).
name: Deploy InaZurvivors (web)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publicar:
        description: Integrar los recursos autorizados y desplegar
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  PUBLICAR: ${{ github.event_name == 'workflow_dispatch' && inputs.publicar }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx vitest run tests/systems.test.ts tests/online.test.ts
      - run: npx tsc --noEmit
      - name: Comprobar la autorización
        if: env.PUBLICAR == 'true'
        run: node tools/integrar_recursos.mjs --comprobar
      - name: Comprobar el acceso a los recursos
        if: env.PUBLICAR == 'true'
        env:
          RECURSOS_TOKEN: ${{ secrets.RECURSOS_TOKEN }}
        run: |
          if [ -z "$RECURSOS_TOKEN" ]; then echo "ERROR: falta el secreto RECURSOS_TOKEN"; exit 1; fi
      - name: Descargar los recursos
        if: env.PUBLICAR == 'true'
        uses: actions/checkout@v4
        with:
          repository: AstraStorm/InaZurvivors-recursos
          token: ${{ secrets.RECURSOS_TOKEN }}
          path: .recursos
          persist-credentials: false
      - name: Integrar los recursos autorizados
        if: env.PUBLICAR == 'true'
        run: node tools/integrar_recursos.mjs --recursos .recursos
      - run: npx vite build
        env:
          # public values: the publishable key is meant for the browser; no secret ever goes here
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://svtkmuxwdxdwvdvjchut.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || 'sb_publishable_CNdrHsKes1JJV4TEsUbzXg_t7_0fnnW' }}
      - name: Comprobar la build
        if: env.PUBLICAR == 'true'
        run: node tools/comprobar_build.mjs --recursos .recursos
      - if: env.PUBLICAR == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.publicar
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
