<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#050c22" />
  <title>InaZurvivors</title>
  <meta name="description" content="InaZurvivors: fangame roguelite de supervivencia, gratuito y no oficial, inspirado en Inazuma Eleven. Se juega en el navegador, como invitado o con una cuenta de Google opcional." />
  <meta name="application-name" content="InaZurvivors" />
  <meta property="og:site_name" content="InaZurvivors" />
  <meta property="og:title" content="InaZurvivors" />
  <meta property="og:description" content="Fangame roguelite de fútbol, gratuito y no oficial, inspirado en Inazuma Eleven." />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="icon" href="icon-32.png" sizes="32x32" type="image/png" />
  <link rel="icon" href="icon-16.png" sizes="16x16" type="image/png" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <style>
    /* boot screen: plain CSS in the page itself, so something is on screen before any script or font arrives */
    html, body { margin: 0; height: 100%; background: #050c22; }
    #boot { position: fixed; inset: 0; z-index: 50; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: #e8f2ff; font: 12px/1.5 'Press Start 2P', ui-monospace, monospace; transition: opacity .45s, transform .45s;
      background: radial-gradient(ellipse at 50% 38%, #1a4aa8 0%, #0c2463 38%, #050c22 78%); }
    /* speed lines sweeping across, like an Inazuma special move */
    #boot::before { content: ''; position: absolute; inset: -50%; opacity: .16; animation: bootRush 1.4s linear infinite;
      background: repeating-linear-gradient(115deg, transparent 0 46px, #7fd3ff 46px 48px, transparent 48px 110px, #ffe24a 110px 111px, transparent 111px 170px); }
    /* the pitch: halfway line and centre circle */
    #boot::after { content: ''; position: absolute; left: 50%; top: 50%; width: 380px; height: 380px; translate: -50% -50%; border-radius: 50%;
      border: 3px solid rgba(127, 211, 255, .09); box-shadow: 0 0 0 9999px transparent; pointer-events: none;
      background: linear-gradient(90deg, transparent calc(50% - 1.5px), rgba(127, 211, 255, .09) calc(50% - 1.5px) calc(50% + 1.5px), transparent calc(50% + 1.5px)); }
    #boot .core { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; gap: 22px; padding: 0 16px; }
    /* the Raimon crest (icon-192.png), floating over a glow and a spinning dashed ring */
    #boot .logo { position: relative; width: 170px; height: 170px; display: grid; place-items: center; }
    #boot .logo::before { content: ''; position: absolute; inset: -24px; border-radius: 50%; background: radial-gradient(circle, rgba(255, 176, 32, .55), transparent 65%);
      animation: bootGlow 1.6s ease-in-out infinite; }
    #boot .ring { position: absolute; inset: 0; border-radius: 50%; border: 4px dashed rgba(127, 211, 255, .7); animation: bootSpin 8s linear infinite; }
    #boot .logo img { position: relative; width: 136px; height: 136px; image-rendering: pixelated; animation: bootBob 1.6s ease-in-out infinite;
      filter: drop-shadow(0 7px 0 rgba(0, 0, 0, .5)); }
    #boot h1 { margin: 0; font-size: clamp(20px, 6vw, 34px); letter-spacing: 4px; color: #ffe24a; text-transform: uppercase; text-align: center;
      text-shadow: 3px 3px 0 #c45a00, 6px 6px 0 #000; transform: skewX(-8deg); }
    #boot .tag { margin: -10px 0 0; font-size: 9px; letter-spacing: 2px; color: #7fd3ff; text-transform: uppercase; }
    #boot .bar { position: relative; width: min(380px, 78vw); height: 18px; margin-top: 6px; transform: skewX(-20deg); background: #071636;
      border: 3px solid #ffe24a; box-shadow: 4px 4px 0 #000, inset 0 0 0 2px #0b2a66; overflow: hidden; }
    #boot .bar i { display: block; height: 100%; width: 0; transition: width .25s;
      background: repeating-linear-gradient(90deg, #ffb020 0 12px, #ffd21f 12px 24px); background-size: 48px 100%; animation: bootStripe .5s linear infinite;
      box-shadow: 0 0 12px #ffd21f; }
    #boot .row { display: flex; justify-content: space-between; gap: 16px; width: min(380px, 78vw); font-size: 10px; }
    #boot-msg { color: #e8f2ff; } #boot-pct { color: #ffe24a; }
    #boot-tip { max-width: min(420px, 86vw); min-height: 3em; margin: 8px 0 0; font-size: 9px; line-height: 1.7; color: #a9bde6; text-align: center; transition: opacity .3s; }
    #boot footer { position: absolute; z-index: 1; bottom: 14px; left: 16px; right: 16px; text-align: center; font: 11px/1.5 system-ui, sans-serif; color: #6f86b8; }
    #boot footer a { color: #8fb4f0; margin: 0 6px; }
    #boot.gone { opacity: 0; transform: scale(1.04); pointer-events: none; }
    @keyframes bootRush { to { transform: translateX(170px); } }
    @keyframes bootGlow { 50% { opacity: .5; transform: scale(.9); } }
    @keyframes bootBob { 50% { transform: translateY(-6px); } }
    @keyframes bootSpin { to { transform: rotate(360deg); } }
    @keyframes bootStripe { to { background-position: 48px 0; } }
    @media (prefers-reduced-motion: reduce) { #boot::before, #boot .logo::before, #boot .ring, #boot .logo img, #boot .bar i { animation: none; } }
  </style>
</head>
<body>
  <div id="boot">
    <div class="core">
      <div class="logo"><div class="ring"></div><img src="icon-192.png" alt="Escudo del Raimon" /></div>
      <h1>InaZurvivors</h1>
      <p class="tag">Fangame roguelite de fútbol</p>
      <div class="bar"><i id="boot-bar"></i></div>
      <div class="row"><span id="boot-msg">Cargando…</span><span id="boot-pct">0%</span></div>
      <p id="boot-tip"></p>
    </div>
    <footer>Fangame gratuito y no oficial, inspirado en Inazuma Eleven (LEVEL-5).<br /><a href="privacidad.html">Privacidad</a><a href="terminos.html">Condiciones</a><a href="https://github.com/AstraStorm/InaZurvivors">GitHub</a></footer>
  </div>
  <script>
    (function () {
      var tips = ['Consejo: el capitán da un bonus a todo el equipo.', 'Consejo: prueba las técnicas en Entrenamiento antes de jugar.',
        'Consejo: tras vencer al jefe, la supervivencia sigue sin fin.', 'Consejo: mejora a tus futbolistas con copias repetidas.',
        'Consejo: entra con Google para guardar tu club en la nube.'];
      // 2.3: the same language choice as src/i18n/i18n.ts (the saved one, else the browser's first language)
      var lang = '';
      try { lang = (JSON.parse(localStorage.getItem('ie-survivors-save') || 'null') || {}).settings.lang || ''; } catch (e) { lang = ''; }
      if (lang !== 'es' && lang !== 'en' && lang !== 'fr' && lang !== 'it' && lang !== 'de' && lang !== 'ca' && lang !== 'pt') {
        var first = (navigator.languages && navigator.languages[0]) || navigator.language || '';
        lang = /^en/i.test(first) ? 'en' : /^fr/i.test(first) ? 'fr' : /^it/i.test(first) ? 'it' : /^de/i.test(first) ? 'de' : /^ca/i.test(first) ? 'ca' : /^pt/i.test(first) ? 'pt' : 'es'; // 2.4: French, Italian and German too; 2.5: Catalan and Portuguese
      }
      var set = function (sel, text) { var e = document.querySelector(sel); if (e) e.textContent = text; };
      var foot = function (html) { var f = document.querySelector('#boot footer'); if (f) f.innerHTML = html; };
      if (lang === 'en') {
        document.documentElement.lang = 'en';
        tips = ['Tip: the captain gives a bonus to the whole team.', 'Tip: try techniques in Training before playing.',
          'Tip: after beating the boss, survival goes on forever.', 'Tip: improve your players with duplicate copies.',
          'Tip: sign in with Google to save your club in the cloud.'];
        set('#boot .tag', 'Football roguelite fangame');
        set('#boot-msg', 'Loading…');
        foot('Free, unofficial fangame inspired by Inazuma Eleven (LEVEL-5).<br /><a href="privacidad.html">Privacy</a><a href="terminos.html">Terms</a><a href="https://github.com/AstraStorm/InaZurvivors">GitHub</a>');
      } else if (lang === 'fr') {
        document.documentElement.lang = 'fr';
        tips = ['Astuce : le capitaine donne un bonus à toute l\'équipe.', 'Astuce : essaie les techniques à l\'Entraînement avant de jouer.',
          'Astuce : après avoir battu le boss, la survie continue sans fin.', 'Astuce : améliore tes joueurs avec des copies en double.',
          'Astuce : connecte-toi avec Google pour sauvegarder ton club dans le cloud.'];
        set('#boot .tag', 'Fangame roguelite de foot');
        set('#boot-msg', 'Chargement…');
        foot('Fangame gratuit et non officiel, inspiré d\'Inazuma Eleven (LEVEL-5).<br /><a href="privacidad.html">Confidentialité</a><a href="terminos.html">Conditions</a><a href="https://github.com/AstraStorm/InaZurvivors">GitHub</a>');
      } else if (lang === 'it') {
        document.documentElement.lang = 'it';
        tips = ['Consiglio: il capitano dà un bonus a tutta la squadra.', 'Consiglio: prova le tecniche in Allenamento prima di giocare.',
          'Consiglio: dopo aver sconfitto il boss, la sopravvivenza continua senza fine.', 'Consiglio: migliora i tuoi giocatori con le copie doppie.',
          'Consiglio: accedi con Google per salvare il tuo club nel cloud.'];
        set('#boot .tag', 'Fangame roguelite di calcio');
        set('#boot-msg', 'Caricamento…');
        foot('Fangame gratuito e non ufficiale, ispirato a Inazuma Eleven (LEVEL-5).<br /><a href="privacidad.html">Privacy</a><a href="terminos.html">Condizioni</a><a href="https://github.com/AstraStorm/InaZurvivors">GitHub</a>');
      } else if (lang === 'de') {
        document.documentElement.lang = 'de';
        tips = ['Tipp: Der Kapitän gibt dem ganzen Team einen Bonus.', 'Tipp: Probier Techniken im Training aus, bevor du spielst.',
          'Tipp: Nach dem Sieg über den Boss geht das Überleben endlos weiter.', 'Tipp: Verbessere deine Spieler mit doppelten Kopien.',
          'Tipp: Melde dich mit Google an, um deinen Club in der Cloud zu speichern.'];
        set('#boot .tag', 'Fußball-Roguelite-Fangame');
        set('#boot-msg', 'Lädt…');
        foot('Kostenloses, inoffizielles Fangame, inspiriert von Inazuma Eleven (LEVEL-5).<br /><a href="privacidad.html">Datenschutz</a><a href="terminos.html">Bedingungen</a><a href="https://github.com/AstraStorm/InaZurvivors">GitHub</a>');
      } else if (lang === 'ca') {
        document.documentElement.lang = 'ca';
        tips = ['Consell: el capità dona un bonus a tot l\'equip.', 'Consell: prova les tècniques a Entrenament abans de jugar.',
          'Consell: després de vèncer el cap, la supervivència continua sense fi.', 'Consell: millora els teus futbolistes amb còpies repetides.',
          'Consell: entra amb Google per desar el teu club al núvol.'];
        set('#boot .tag', 'Fangame roguelite de futbol');
        set('#boot-msg', 'Carregant…');
        foot('Fangame gratuït i no oficial, inspirat en Inazuma Eleven (LEVEL-5).<br /><a href="privacidad.html">Privacitat</a><a href="terminos.html">Condicions</a><a href="https://github.com/AstraStorm/InaZurvivors">GitHub</a>');
      } else if (lang === 'pt') {
        document.documentElement.lang = 'pt-BR';
        tips = ['Dica: o capitão dá um bônus a todo o time.', 'Dica: teste as técnicas no Treino antes de jogar.',
          'Dica: depois de vencer o chefe, a sobrevivência continua sem fim.', 'Dica: melhore seus jogadores com cópias repetidas.',
          'Dica: entre com o Google para salvar seu clube na nuvem.'];
        set('#boot .tag', 'Fangame roguelite de futebol');
        set('#boot-msg', 'Carregando…');
        foot('Fangame gratuito e não oficial, inspirado em Inazuma Eleven (LEVEL-5).<br /><a href="privacidad.html">Privacidade</a><a href="terminos.html">Termos</a><a href="https://github.com/AstraStorm/InaZurvivors">GitHub</a>');
      }
      var el = document.getElementById('boot-tip'), n = Math.floor(Math.random() * tips.length);
      var show = function () { el.textContent = tips[n++ % tips.length]; };
      show();
      var id = setInterval(function () { if (!document.getElementById('boot')) clearInterval(id); else show(); }, 3200);
    })();
  </script>
  <div id="game"></div>
  <div id="ui"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
